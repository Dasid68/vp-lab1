<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Workshop form</title>

    <style>
        .form{
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;

        }
    </style>

</head>


<body>


<h1>Додади/уреди работилница</h1>

<div>
    <form class="form" method="post" th:action="${workshop == null} ? @{/workshops/add} : @{ /workshops/edit/{workshopId}(workshopId=${workshop.getId()})}">
        <label for="title">Наслов</label>
        <input type="text" id="title" name="title" th:value="${workshop != null ? workshop.getTitle() : ''}">
        <label for="category">Категорија</label>
        <input type="text" id="category" name="category" th:value="${workshop != null ? workshop.getCategory() : ''}">
        <label for="price">Цена</label>
        <input type="number" id="price" name="price" min="0" step="0.01" th:value="${workshop != null ? workshop.getPrice() : ''}">
        <label for="capacity">Капацитет</label>
        <input type="number" id="capacity" name="capacity" min="0" th:value="${workshop != null ? workshop.getCapacity() : ''}">
        <label for="instructorId">Инструктор</label>
        <select id="instructorId" name="instructorId">
            <option th:each="instructor : ${instructors}"
                    th:text="|${instructor.getName()} ${instructor.getSurname()}|"
                    th:selected="${workshop != null && workshop.getInstructor().getId().equals(instructor.getId()) ?: null}"
                    th:value="${instructor.getId()}"
            ></option>
        </select>


        <button type="submit">Зачувај</button>
    </form>
</div>



</body>
</html>
